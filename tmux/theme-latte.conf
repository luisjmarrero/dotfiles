# tmux Catppuccin Latte (light) overrides
# Sourced automatically when macOS is in Light Mode.

set -g @catppuccin_flavor "latte"

# Differentiate RAM from CPU (both default to yellow)
set -g @catppuccin_ram_color "#fe640b"
set -g @catppuccin_status_ram_icon_bg "#fe640b"

# tmux-cpu color scripts echo these as raw values inside #[fg=]/#[bg=].
# Catppuccin's defaults leave #{E:@thm_*} unexpanded, which breaks styles.
set -g @cpu_low_fg_color "#4c4f69"
set -g @cpu_medium_fg_color "#4c4f69"
set -g @cpu_high_fg_color "#eff1f5"
set -g @cpu_low_bg_color "#ccd0da"
set -g @cpu_medium_bg_color "#ccd0da"
set -g @cpu_high_bg_color "#d20f39"

set -g @ram_low_fg_color "#4c4f69"
set -g @ram_medium_fg_color "#4c4f69"
set -g @ram_high_fg_color "#4c4f69"
set -g @ram_low_bg_color "#ccd0da"
set -g @ram_medium_bg_color "#ccd0da"
set -g @ram_high_bg_color "#ccd0da"

# Message (toast) styling - mauve accent, matches popup-border-style
set -g message-style "bg=#8839ef,fg=#eff1f5,bold"

# Popup border - mauve accent
set -g popup-border-style "fg=#8839ef"

# Green bordered "toast" for clipboard copy, bottom-center, auto-closes
set -g @clipboard_toast "display-popup -B -E -w 26 -h 3 -x C -y S -s 'fg=#40a02b,bold' -S 'fg=#40a02b' -b rounded \"printf '  Copied to clipboard'; sleep 0.6\""
