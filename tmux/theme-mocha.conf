# tmux Catppuccin Mocha (dark) overrides
# Sourced automatically when macOS is in Dark Mode - values unchanged
# from before this file existed.

set -g @catppuccin_flavor "mocha"

# Differentiate RAM from CPU (both default to yellow)
set -g @catppuccin_ram_color "#fab387"
set -g @catppuccin_status_ram_icon_bg "#fab387"

# tmux-cpu color scripts echo these as raw values inside #[fg=]/#[bg=].
# Catppuccin's defaults leave #{E:@thm_*} unexpanded, which breaks styles.
set -g @cpu_low_fg_color "#cdd6f4"
set -g @cpu_medium_fg_color "#cdd6f4"
set -g @cpu_high_fg_color "#11111b"
set -g @cpu_low_bg_color "#313244"
set -g @cpu_medium_bg_color "#313244"
set -g @cpu_high_bg_color "#f38ba8"

set -g @ram_low_fg_color "#cdd6f4"
set -g @ram_medium_fg_color "#cdd6f4"
set -g @ram_high_fg_color "#cdd6f4"
set -g @ram_low_bg_color "#313244"
set -g @ram_medium_bg_color "#313244"
set -g @ram_high_bg_color "#313244"

# Message (toast) styling - mauve accent, matches popup-border-style
set -g message-style "bg=#cba6f7,fg=#11111b,bold"

# Popup border - mauve accent
set -g popup-border-style "fg=#cba6f7"

# Green bordered "toast" for clipboard copy, bottom-center, auto-closes
set -g @clipboard_toast "display-popup -B -E -w 26 -h 3 -x C -y S -s 'fg=#a6e3a1,bold' -S 'fg=#a6e3a1' -b rounded \"printf '  Copied to clipboard'; sleep 0.6\""
