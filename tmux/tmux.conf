# ============================================================
# Environment
# ============================================================

set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.tmux/plugins


# ============================================================
# Plugins (TPM)
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'rickstaa/tmux-notify'


# ============================================================
# General tmux settings
# ============================================================

set -s default-terminal "tmux-256color"
set -g history-limit 100000

set -g mouse on

set -g status-interval 2

# Message / toast display duration (ms) - used by display-message calls
set -g display-time 1500

# Window naming
setw -g allow-rename off
setw -g automatic-rename off
set -g set-titles off

# Terminal features
set -ga terminal-overrides ',xterm-256color:Tc'
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Claude / terminal passthrough
set -g allow-passthrough off

# Session behavior
set -g detach-on-destroy off
set -g destroy-unattached off


# ============================================================
# Default shell
# ============================================================

set-option -g default-command "zsh -i"


# ============================================================
# Splits
# ============================================================

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %


# ============================================================
# Catppuccin
# ============================================================

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Window names
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"

# Rounded pills that don't bleed into each other
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"

# Differentiate RAM from CPU (both default to yellow)
set -g @catppuccin_ram_color "#fab387"
set -g @catppuccin_status_ram_icon_bg "#fab387"

# Used/Total instead of percentage (macOS).
# #{l:...} keeps #() from being evaluated at set -gF time so it refreshes.
set -g @catppuccin_ram_text " #{l:#(/Users/luismarrero/.dotfiles/tmux/scripts/ram_usage.sh)}"

# Load theme before status so modules exist; TPM (below) then
# lets tmux-cpu interpolate #{cpu_percentage} in status-right.
run "~/.tmux/plugins/tmux/catppuccin.tmux"

# tmux-cpu color scripts echo these as raw values inside #[fg=]/#[bg=].
# Catppuccin's defaults leave #{E:@thm_*} unexpanded, which breaks styles.
set -g @cpu_low_fg_color "#cdd6f4"
set -g @cpu_medium_fg_color "#cdd6f4"
set -g @cpu_high_fg_color "#11111b"
set -g @cpu_low_bg_color "#313244"
set -g @cpu_medium_bg_color "#313244"
set -g @cpu_high_bg_color "#f38ba8"

set -g @ram_low_fg_color "#cdd6f4"
set -g @ram_medium_fg_color "#cdd6f4"
set -g @ram_high_fg_color "#cdd6f4"
set -g @ram_low_bg_color "#313244"
set -g @ram_medium_bg_color "#313244"
set -g @ram_high_bg_color "#313244"

# Status layout
set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#{E:@catppuccin_status_session}"

set -gF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# Message (toast) styling - mauve accent, matches popup-border-style
set -g message-style "bg=#cba6f7,fg=#11111b,bold"


# ============================================================
# Resurrect / Continuum
# ============================================================

set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

set -g @continuum-restore 'on'


# ============================================================
# Popups
# ============================================================

set -g popup-border-style "fg=#cba6f7"
set -g popup-border-lines rounded


# ============================================================
# Custom bindings
# ============================================================

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

unbind s
bind s display-popup -E -w 50% -h 60% -T " sessions " \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse --border rounded \
  | xargs -r tmux switch-client -t"


# ============================================================
# Copy mode / mouse behavior
# ============================================================

set -g focus-events off

bind -n MouseDown1Pane select-pane -t = \; send-keys -M

unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# Green bordered "toast" for clipboard copy, bottom-center, auto-closes
set -g @clipboard_toast "display-popup -B -E -w 26 -h 3 -x C -y S -s 'fg=#a6e3a1,bold' -S 'fg=#a6e3a1' -b rounded \"printf '  Copied to clipboard'; sleep 0.6\""

bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe \; run-shell "tmux #{@clipboard_toast}"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe \; run-shell "tmux #{@clipboard_toast}"

# vi-mode yank (y) - same toast on keyboard copy
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \; run-shell "tmux #{@clipboard_toast}"


# ============================================================
# TPM - MUST BE LAST
# ============================================================

run "~/.tmux/plugins/tpm/tpm"
