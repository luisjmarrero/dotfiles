add_newline = true

continuation_prompt = '▶▶ '

# A minimal left prompt
format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$hg_branch\
$line_break\
$character"""

# move the rest of the prompt to the right
right_format = """
$python\
$ruby\
${custom.rails}\
$nodejs\
$aws\
${custom.docker-enabled}"""

[aws]
symbol = " "

[c]
symbol = " "

[character]
success_symbol = "[](bold green)"
error_symbol = "[✘](bold red)"

[cmd_duration]
min_time = 10_000                    # Show command duration over 10,000 milliseconds (=10 sec)
format = " took [$duration]($style)"
show_milliseconds = false
disabled = false
style = "italic yellow"

[dart]
symbol = " "

[directory]
truncation_length = 3
truncation_symbol = " 󰝰 "
home_symbol = "󰋜 ~"
read_only = "  "
style = "bold blue"
read_only_style = "bold red"
format = '[$path]($style)[$read_only]($read_only_style) '

[directory.substitutions]
"Documents" = " 󰈙 "
"Downloads" = ""
"Music" = " "
"Pictures" = " "

[git_branch]
# symbol = " "
symbol = " "
style = "bold purple"

[git_status]
format = '([$all_status $ahead_behind]($style))'
# style = "red bold"
style = "bold red"

conflicted = ""    # nf-dev-git_merge
# conflicted = ""
# ahead      = "󱞫"    # nf-oct-arrow_up
ahead      = ""
behind     = ""    # nf-oct-arrow_down
diverged   = "󰁜"    # nf-dev-git_branch
# up_to_date = "✓"
up_to_date = ''
untracked  = ""    # nf-oct-file
stashed    = ""    # nf-oct-archive
modified   = ""    # nf-oct-pencil
staged     = ""    # nf-fa-plus_square
renamed    = ""    # nf-oct-arrow_right
deleted    = ""    # nf-oct-trashcan

# untracked = " $count "
# modified = " $count "
# deleted = " $count "
# staged = " $count "
# renamed = " $count "
# stashed = " $count "

[git_metrics]
added_style = 'bold green'
only_nonzero_diffs = true
disabled = false
format = ' [+$added]($added_style)/[-$deleted]($deleted_style) '

[golang]
symbol = " "

[guix_shell]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_only = false
format = '[at $ssh_symbol$hostname ]($style)'
trim_at = "."
disabled = true

[java]
format = '[${symbol}(${version} )]($style)'
symbol = " "
style = "red"
version_format = 'v${raw}'

[kubernetes]
format = 'on [ $context\($namespace\)](bold purple) '
disabled = true

[memory_usage]
symbol = "󰍛 "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[nodejs]
symbol = " "
style = "bold green"
format = '[$symbol($version )]($style)'

[os]
format = "[$symbol]($style)"
disabled = true
style = 'white'

[os.symbols]
Alpine = " "
Amazon = " "
Android = " "
Arch = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "﯑ "
Gentoo = " "
HardenedBSD = "ﲊ "
Illumos = " "
Linux = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
OpenBSD = " "
openSUSE = " "
OracleLinux = " "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
Redox = " "
Solus = "ﴱ "
SUSE = " "
Ubuntu = " "
Unknown = " "
Windows = " "

[package]
symbol = '📦 '
disabled = true

[python]
symbol = " "
style = "bold cyan"

[ruby]
symbol = " "
style = "bold red"
format = '[$symbol($version )]($style)'

[rust]
symbol = " "

[scala]
symbol = " "

[username]
disabled = true

[custom.docker-enabled]
description = "Shows the docker symbol if the current directory has Dockerfile or docker-compose.yml files"
command = 'echo '
files = ["Dockerfile", "docker-compose.yml", "docker-compose.yaml"]
when = """ command -v docker &> /dev/null; exit (echo $?); """
format = '[ $output ]($style)'
style = "bold blue"

[custom.rails]
# command = "bundle exec rails -v | sed 's/Rails //'" # slow
command = "grep -E ' rails \\([0-9]' Gemfile.lock | sed -E 's/.*rails \\(([^)]+)\\).*/\\1/'"
detect_files = ['Gemfile.lock']
symbol = ""
style = "bold red"
format = '[$symbol( v$output) ]($style)'

